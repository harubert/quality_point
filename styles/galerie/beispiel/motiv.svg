<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>White Cube: ein großes gerahmtes Werk mit Kind und Tablet in drei Grautönen, Wandschild mit rotem Quadrat</title>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <rect x="0" y="640" width="1200" height="160" fill="#F1F1F0"/>
  <path d="M0 640 H1200" stroke="#E2E2E0" stroke-width="1"/>
  <!-- Rahmen und Passepartout -->
  <rect x="600" y="110" width="520" height="420" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="680" y="180" width="360" height="280" fill="#F1F1F0"/>
  <!-- Werk: Kind mit Tablet, drei Grautöne -->
  <rect x="680" y="380" width="360" height="80" fill="#BDBDBB"/>
  <circle cx="860" cy="262" r="40" fill="#222222"/>
  <path d="M812 310 C812 298 908 298 908 310 L916 440 H804 Z" fill="#222222"/>
  <rect x="820" y="344" width="80" height="58" rx="4" fill="#6E6E6E"/>
  <rect x="828" y="352" width="64" height="42" fill="#F1F1F0"/>
  <path d="M790 330 C770 350 764 376 768 400" stroke="#222222" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M930 330 C950 350 956 376 952 400" stroke="#222222" stroke-width="18" stroke-linecap="round" fill="none"/>
  <rect x="700" y="200" width="60" height="80" fill="#6E6E6E"/>
  <rect x="712" y="212" width="36" height="56" fill="#F1F1F0"/>
  <!-- Wandschild mit rotem Quadrat -->
  <rect x="600" y="560" width="110" height="26" fill="#F1F1F0" stroke="#E2E2E0" stroke-width="1"/>
  <rect x="610" y="568" width="10" height="10" fill="#CF3A1B"/>
  <rect x="630" y="570" width="60" height="6" fill="#BDBDBB"/>
</svg>
