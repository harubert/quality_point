<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>White Cube: drei gerahmte Bildtafeln mit Tablet, Buch und Stift, davor ein betrachtendes Kind und eine Bank</title>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <!-- Boden -->
  <rect x="0" y="620" width="1200" height="180" fill="#F1F1F0"/>
  <path d="M0 620 H1200" stroke="#E2E2E0" stroke-width="1"/>
  <!-- drei Rahmen mit breitem Passepartout -->
  <g fill="#FFFFFF" stroke="#222222" stroke-width="2">
    <rect x="560" y="170" width="190" height="240"/>
    <rect x="800" y="170" width="190" height="240"/>
    <rect x="1040" y="170" width="140" height="240"/>
  </g>
  <!-- Motiv 1: Tablet -->
  <rect x="612" y="236" width="86" height="118" rx="8" fill="#222222"/>
  <rect x="620" y="246" width="70" height="92" fill="#FFFFFF"/>
  <rect x="632" y="282" width="46" height="8" fill="#BDBDBB"/>
  <rect x="632" y="298" width="36" height="8" fill="#BDBDBB"/>
  <!-- Motiv 2: aufgeschlagenes Buch -->
  <path d="M846 262 C870 252 886 254 895 262 C904 254 920 252 944 262 V340 C920 332 904 334 895 342 C886 334 870 332 846 340 Z" fill="#6E6E6E"/>
  <path d="M895 262 V342" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M858 282 C870 276 882 276 888 280 M858 298 C870 292 882 292 888 296 M858 314 C868 308 880 308 888 312 M902 280 C908 276 920 276 932 282 M902 296 C908 292 920 292 932 298 M902 312 C908 308 920 308 932 314" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <!-- Motiv 3: Stift -->
  <path d="M1086 350 L1134 232" stroke="#222222" stroke-width="12" stroke-linecap="butt"/>
  <path d="M1086 350 L1081 366 L1096 354 Z" fill="#222222"/>
  <path d="M1134 232 L1140 218" stroke="#BDBDBB" stroke-width="12"/>
  <!-- Wandschilder -->
  <g fill="#F1F1F0" stroke="#E2E2E0" stroke-width="1">
    <rect x="560" y="440" width="60" height="22"/>
    <rect x="800" y="440" width="60" height="22"/>
    <rect x="1040" y="440" width="60" height="22"/>
  </g>
  <!-- roter Punkt: einziger Farbakzent -->
  <circle cx="636" cy="451" r="5" fill="#CF3A1B"/>
  <!-- Bank -->
  <rect x="880" y="590" width="260" height="14" fill="#6E6E6E"/>
  <rect x="900" y="604" width="10" height="60" fill="#6E6E6E"/>
  <rect x="1110" y="604" width="10" height="60" fill="#6E6E6E"/>
  <!-- Kind als Silhouette, von hinten betrachtend -->
  <g transform="translate(14 70)">
    <circle cx="690" cy="378" r="36" fill="#222222"/>
    <path d="M650 420 C650 410 730 410 730 420 L740 560 H640 Z" fill="#222222"/>
    <rect x="652" y="556" width="30" height="108" rx="6" fill="#222222"/>
    <rect x="698" y="556" width="30" height="108" rx="6" fill="#222222"/>
    <path d="M652 450 C636 480 630 510 634 540" stroke="#222222" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M728 450 C744 480 750 510 746 540" stroke="#222222" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>
