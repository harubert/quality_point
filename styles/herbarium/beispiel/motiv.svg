<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Naturkundliche Tafel: lesendes Kind mit Buch, Topfpflanze und angelehntem Tablet</title>
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 3H6" stroke="#2E3A2A" stroke-width=".9" opacity=".45"/></pattern>
    <pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 2.5H5" stroke="#2E3A2A" stroke-width=".7" opacity=".4"/></pattern>
    <filter id="korn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .26 0 0 0 0 .12 0 0 0 .12 0"/></filter>
    <g id="blatt"><path d="M0 0 C-16 -24 -16 -62 0 -84 C16 -62 16 -24 0 0 Z" fill="#557052" fill-opacity=".55"/><path d="M0 -4 V-80 M0 -32 C-9 -38 -12 -46 -13 -56 M0 -32 C9 -38 12 -46 13 -56 M0 -54 C-7 -59 -9 -65 -10 -72 M0 -54 C7 -59 9 -65 10 -72" stroke-width="1.2"/></g>
    <g id="nadel"><circle r="6.5" fill="#A4482B" stroke="none"/><circle cx="-2" cy="-2" r="2" fill="#F8EEDD" stroke="none"/></g>
  </defs>
  <rect width="1200" height="800" fill="#F3EEDF"/>
  <rect width="1200" height="800" filter="url(#korn)"/>
  <g fill="none" stroke="#CFC6A8" stroke-width="1"><rect x="24" y="24" width="1152" height="752"/><rect x="31" y="31" width="1138" height="738"/></g>
  <g fill="none" stroke="#2E3A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bodenlinie -->
    <path d="M430 690 H1150" stroke="#CFC6A8" stroke-width="1.4"/>
    <!-- Topfpflanze -->
    <path d="M1010 690 L1024 560 H1126 L1140 690 Z" fill="#A4482B" fill-opacity=".45"/>
    <path d="M1070 690 L1082 560 H1126 L1140 690 Z" fill="url(#h2)" stroke="none"/>
    <rect x="1014" y="544" width="122" height="20" rx="3" fill="#FBF8EE"/>
    <path d="M1075 544 C1070 480 1080 420 1075 350 M1075 480 C1040 470 1020 440 1016 400 M1075 440 C1110 430 1130 400 1136 360" stroke-width="2.2"/>
    <use xlink:href="#blatt" transform="translate(1016 402) rotate(-30)"/>
    <use xlink:href="#blatt" transform="translate(1136 362) rotate(28)"/>
    <use xlink:href="#blatt" transform="translate(1075 352) rotate(-4)"/>
    <use xlink:href="#blatt" transform="translate(1048 470) rotate(-60)"/>
    <use xlink:href="#blatt" transform="translate(1104 436) rotate(58)"/>
    <!-- angelehntes Tablet -->
    <g transform="rotate(-8 940 600)">
      <rect x="860" y="470" width="160" height="220" rx="12" fill="url(#h)" stroke="none" transform="translate(8 8)"/>
      <rect x="860" y="470" width="160" height="220" rx="12" fill="#FBF8EE"/>
      <rect x="874" y="488" width="132" height="176" rx="3" fill="#E9E2CC"/>
      <path d="M940 640 C918 612 916 560 940 520 C964 560 962 612 940 640 Z" fill="#557052" fill-opacity=".5"/>
      <path d="M940 636 V524" stroke-width="1.2"/>
      <circle cx="940" cy="676" r="5"/>
    </g>
    <!-- sitzendes Kind, ohne Gesicht -->
    <path d="M620 690 C600 650 606 600 650 580 L870 580 C910 600 918 650 896 690 Z" fill="#C9972B" fill-opacity=".45"/>
    <path d="M620 690 C600 650 606 600 650 580 L740 580 L740 690 Z" fill="url(#h2)" stroke="none"/>
    <path d="M690 582 V460 C690 418 720 396 760 396 C800 396 830 418 830 460 V582 Z" fill="#FBF8EE"/>
    <path d="M790 582 V420 C808 426 830 440 830 460 V582 Z" fill="url(#h)" stroke="none"/>
    <circle cx="760" cy="330" r="58" fill="#FBF8EE"/>
    <path d="M706 316 C716 262 804 262 814 316 C790 300 730 300 706 316 Z" fill="#2E3A2A" fill-opacity=".75"/>
    <path d="M702 338 C712 292 744 272 760 272 C736 290 716 320 702 338 Z" fill="#2E3A2A" fill-opacity=".75"/>
    <!-- Arme und offenes Buch -->
    <path d="M690 450 C650 470 630 500 640 540" stroke-width="22"/>
    <path d="M690 450 C650 470 630 500 640 540" stroke-width="18" stroke="#FBF8EE"/>
    <path d="M830 450 C870 470 890 500 880 540" stroke-width="22"/>
    <path d="M830 450 C870 470 890 500 880 540" stroke-width="18" stroke="#FBF8EE"/>
    <path d="M636 528 C690 506 740 506 760 520 C780 506 830 506 884 528 L884 600 C830 580 780 580 760 596 C740 580 690 580 636 600 Z" fill="#FBF8EE"/>
    <path d="M760 520 V596" stroke-width="1.4"/>
    <path d="M656 542 C700 526 730 526 748 536 M656 560 C700 544 730 544 748 554 M656 578 C690 566 716 564 740 570 M772 536 C790 526 820 526 864 542 M772 554 C790 544 820 544 864 560 M780 570 C800 564 830 566 864 578" stroke-width="1" opacity=".55"/>
    <!-- Nadeln am Tafelrand -->
    <use xlink:href="#nadel" x="52" y="54"/><use xlink:href="#nadel" x="1148" y="54"/>
  </g>
</svg>
