<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Zeitungsgrafik in Graustufen: Stapel Zeitungen, Tasse und ein roter Stift</title>
  <defs>
    <pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 2.5H5" stroke="#141414" stroke-width="1.1" opacity=".55"/></pattern>
    <pattern id="h2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 2H4" stroke="#141414" stroke-width="1.4" opacity=".75"/></pattern>
    <filter id="korn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="6"/><feColorMatrix values="0 0 0 0 .2 0 0 0 0 .19 0 0 0 0 .17 0 0 0 .12 0"/></filter>
    <g id="seite"><rect x="-260" y="-24" width="520" height="48" fill="#F3EFE6" stroke="#141414" stroke-width="2"/><path d="M-240 -12 H240 M-240 0 H200 M-240 12 H230" stroke="#B9B3A6" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="800" fill="#E8E3D8"/>
  <rect width="1200" height="800" filter="url(#korn)"/>
  <path d="M420 690 H1180" stroke="#141414" stroke-width="2"/>
  <!-- gefalteter Stapel -->
  <use xlink:href="#seite" transform="translate(800 664) rotate(1)"/>
  <use xlink:href="#seite" transform="translate(806 618) rotate(-2)"/>
  <use xlink:href="#seite" transform="translate(798 572) rotate(2)"/>
  <use xlink:href="#seite" transform="translate(804 526) rotate(-1)"/>
  <!-- oberste Zeitung, aufgeschlagen -->
  <g transform="rotate(-4 810 400)">
    <rect x="540" y="280" width="540" height="230" fill="#F3EFE6" stroke="#141414" stroke-width="2"/>
    <path d="M810 280 V510" stroke="#141414" stroke-width="1"/>
    <rect x="566" y="300" width="170" height="28" fill="#141414"/>
    <path d="M566 340 H1054" stroke="#141414" stroke-width="3"/><path d="M566 347 H1054" stroke="#141414" stroke-width="1"/>
    <rect x="566" y="362" width="220" height="16" fill="#5A5852"/>
    <rect x="566" y="390" width="220" height="96" fill="#B9B3A6" stroke="#141414" stroke-width="2"/>
    <rect x="566" y="390" width="220" height="96" fill="url(#h)"/>
    <path d="M580 476 L630 420 L664 452 L700 410 L772 476 Z" fill="#5A5852"/>
    <g fill="#5A5852">
      <rect x="832" y="362" width="100" height="14"/><rect x="832" y="390" width="100" height="5"/><rect x="832" y="402" width="92" height="5"/><rect x="832" y="414" width="100" height="5"/><rect x="832" y="426" width="88" height="5"/><rect x="832" y="438" width="100" height="5"/><rect x="832" y="450" width="96" height="5"/><rect x="832" y="462" width="100" height="5"/><rect x="832" y="474" width="70" height="5"/>
      <rect x="950" y="362" width="104" height="14"/><rect x="950" y="390" width="104" height="5"/><rect x="950" y="402" width="96" height="5"/><rect x="950" y="414" width="104" height="5"/><rect x="950" y="426" width="90" height="5"/><rect x="950" y="438" width="104" height="5"/><rect x="950" y="450" width="100" height="5"/><rect x="950" y="462" width="104" height="5"/><rect x="950" y="474" width="60" height="5"/>
    </g>
    <path d="M941 362 V482" stroke="#B9B3A6" stroke-width="1"/>
  </g>
  <!-- Tasse -->
  <path d="M1040 560 L1052 690 H1152 L1164 560 Z" fill="#F3EFE6" stroke="#141414" stroke-width="2"/>
  <path d="M1100 560 L1106 690 H1152 L1164 560 Z" fill="url(#h)"/>
  <path d="M1160 590 C1200 590 1200 650 1158 650" fill="none" stroke="#141414" stroke-width="8"/>
  <ellipse cx="1102" cy="560" rx="62" ry="12" fill="#5A5852" stroke="#141414" stroke-width="2"/>
  <!-- roter Stift: einziger Farbakzent -->
  <g transform="rotate(-28 620 600)">
    <rect x="480" y="590" width="280" height="20" rx="3" fill="#B5121B"/>
    <path d="M760 590 L798 600 L760 610 Z" fill="#E8E3D8" stroke="#141414" stroke-width="2"/>
    <path d="M786 597 L798 600 L786 603 Z" fill="#141414"/>
    <rect x="480" y="590" width="26" height="20" fill="#5A5852"/>
  </g>
</svg>
