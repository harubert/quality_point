<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Linolschnitt in Schwarz und Indigo: Tablet mit Sonne, Bücherstapel und Stifte auf Cremepapier</title>
  <defs>
    <filter id="rau" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="3"/><feDisplacementMap in="SourceGraphic" scale="8" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="rau2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="9"/><feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="korn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .08 0 0 0 0 .07 0 0 0 0 .06 0 0 0 .2 -.06"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#F4ECD8"/>
  <!-- zweite Druckplatte: Indigo, leicht versetzt -->
  <g filter="url(#rau)">
    <rect x="652" y="88" width="470" height="640" fill="#2A3F85"/>
    <rect x="456" y="662" width="110" height="60" fill="#2A3F85"/>
  </g>
  <!-- erste Druckplatte: Schwarz -->
  <g filter="url(#rau2)" fill="#161412">
    <!-- Tablet -->
    <rect x="700" y="160" width="370" height="490" rx="22"/>
    <!-- Bücher -->
    <path d="M520 596 L790 590 L794 644 L524 650 Z"/>
    <path d="M548 648 L800 642 L804 696 L552 702 Z"/>
    <path d="M500 700 L810 694 L812 740 L502 746 Z"/>
    <!-- Boden -->
    <rect x="440" y="744" width="720" height="18"/>
  </g>
  <!-- Bildschirm und Binnenzeichnung in Papierfarbe (geschnitten) -->
  <g filter="url(#rau2)" fill="#F4ECD8">
    <rect x="730" y="196" width="310" height="408" rx="6"/>
    <path d="M600 606 L600 638 M560 610 L560 636" stroke="#F4ECD8" stroke-width="7"/>
    <path d="M700 604 L760 602 M700 622 L740 621" stroke="#F4ECD8" stroke-width="6"/>
    <path d="M580 660 L580 690 M620 658 L620 690 M760 656 L780 655" stroke="#F4ECD8" stroke-width="7"/>
    <path d="M530 712 L760 708 M530 728 L700 725" stroke="#F4ECD8" stroke-width="5"/>
  </g>
  <!-- zwei Stifte, geschnitten -->
  <g filter="url(#rau2)" transform="translate(1080 672) rotate(42)">
    <rect x="-130" y="-12" width="210" height="24" fill="#161412"/>
    <path d="M80 -12 L116 0 L80 12 Z" fill="#F4ECD8"/>
    <path d="M104 -4 L116 0 L104 4 Z" fill="#161412"/>
    <path d="M-120 -3 H70" stroke="#F4ECD8" stroke-width="4"/>
  </g>
  <g filter="url(#rau2)" transform="translate(1118 606) rotate(42)">
    <rect x="-110" y="-10" width="180" height="20" fill="#161412"/>
    <path d="M70 -10 L102 0 L70 10 Z" fill="#F4ECD8"/>
    <path d="M92 -3 L102 0 L92 3 Z" fill="#161412"/>
    <path d="M-100 -2 H60" stroke="#F4ECD8" stroke-width="3.5"/>
  </g>
  <!-- Sonne und Wellen auf dem Bildschirm: Indigo-Platte -->
  <g filter="url(#rau)">
    <circle cx="885" cy="330" r="72" fill="#2A3F85"/>
    <g stroke="#2A3F85" stroke-width="16" stroke-linecap="round">
      <path d="M885 212 V236 M885 424 V448 M767 330 H791 M979 330 H1003 M802 247 L819 264 M951 396 L968 413 M968 247 L951 264 M819 396 L802 413"/>
    </g>
    <path d="M748 486 C778 470 808 470 838 486 C868 502 898 502 928 486 C958 470 988 470 1020 486 L1020 508 C988 492 958 492 928 508 C898 524 868 524 838 508 C808 492 778 492 748 508 Z" fill="#2A3F85"/>
    <path d="M748 540 C778 524 808 524 838 540 C868 556 898 556 928 540 C958 524 988 524 1020 540 L1020 562 C988 546 958 546 928 562 C898 578 868 578 838 562 C808 546 778 546 748 562 Z" fill="#2A3F85"/>
  </g>
  <!-- Schnittlinien in der Sonne -->
  <g filter="url(#rau2)" stroke="#F4ECD8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M846 300 C860 284 900 280 920 296 M840 332 C870 322 900 322 930 332 M850 360 C870 352 904 352 918 360"/>
  </g>
  <!-- Druckkorn -->
  <rect width="1200" height="800" filter="url(#korn)"/>
</svg>
