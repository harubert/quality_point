  <g filter="url(#rau2)" stroke="#F4ECD8" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M812 206 C830 176 870 168 906 184 M824 190 C840 168 876 160 912 170"/>
    <path d="M790 352 C830 340 900 340 940 352"/>
    <path d="M780 620 L776 680 M960 620 L964 680 M840 640 L838 690 M900 640 L902 690"/>
    <path d="M560 660 L560 684 M600 658 L600 684 M640 656 L640 682"/>
    <path d="M580 708 L580 732 M630 706 L630 730 M680 704 L680 728"/>
    <path d="M1060 656 L1134 654 M1060 676 L1120 674"/>
  </g>
  <!-- Druckkorn -->
  <rect width="1200" height="800" filter="url(#korn)"/>
</svg>
