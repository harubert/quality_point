<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Geometrische Komposition: Lupe, Bildschirm und Signalformen</title>
  <rect width="1200" height="800" fill="#F4F1EA"/>
  <rect x="760" y="0" width="440" height="800" fill="#1D4E9E"/>
  <!-- Bildschirm -->
  <rect x="470" y="170" width="420" height="300" fill="#111"/>
  <rect x="495" y="195" width="370" height="250" fill="#F4F1EA"/>
  <rect x="525" y="345" width="60" height="80" fill="#C8281E"/>
  <rect x="605" y="295" width="60" height="130" fill="#F2C12E"/>
  <rect x="685" y="245" width="60" height="180" fill="#1D4E9E"/>
  <rect x="765" y="315" width="60" height="110" fill="#111"/>
  <rect x="660" y="470" width="40" height="70" fill="#111"/>
  <rect x="600" y="540" width="160" height="20" fill="#111"/>
  <!-- Lupe -->
  <circle cx="900" cy="520" r="150" fill="none" stroke="#F2C12E" stroke-width="34"/>
  <circle cx="900" cy="520" r="133" fill="#F4F1EA" opacity=".35"/>
  <rect x="1000" y="640" width="180" height="44" fill="#F2C12E" transform="rotate(45 1000 640)"/>
  <!-- Signalformen -->
  <circle cx="1090" cy="150" r="70" fill="#C8281E"/>
  <polygon points="420,700 520,520 620,700" fill="#C8281E"/>
  <rect x="420" y="720" width="340" height="16" fill="#111"/>
</svg>
