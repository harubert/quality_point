    <path d="M1040 676 C1050 660 1080 660 1090 676 C1080 686 1050 686 1040 676 Z" fill="#D9A94A"/>
    <path d="M1000 590 C996 530 1030 492 1066 490 C1110 488 1140 524 1138 584 C1136 630 1110 666 1066 668 C1024 668 1002 632 1000 590 Z" fill="#1E2A33"/>
