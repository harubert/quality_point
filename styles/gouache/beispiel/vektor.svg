    <path d="M1078 400 C1110 396 1150 398 1180 404 C1170 410 1110 412 1080 408 Z" fill="#F3EAD9" opacity=".35"/>
  </g>

  <!-- Tischplatte -->
  <g filter="url(#pinsel)">
