  <g filter="url(#pinselfein)">
    <path d="M470 676 C560 664 640 668 700 680 C760 666 840 662 920 672 C900 676 760 694 700 696 C640 694 520 690 470 676 Z" fill="#7E5A2A" opacity=".55"/>
