<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Gouache-Bilderbuchszene: Kind von hinten am Schreibtisch mit Tablet, Buch, Stiften und Pflanze</title>
  <defs>
    <!-- Pinselrand: Turbulenz verschiebt die Kanten -->
    <filter id="pinsel" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pinselfein" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- matte Farbstruktur: gestreifte Pinselspuren -->
    <filter id="struktur" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .07" numOctaves="3" seed="2"/>
      <feColorMatrix values="0 0 0 0 .14  0 0 0 0 .18  0 0 0 0 .16  0 0 0 -1.6 1.05"/>
    </filter>
    <filter id="weich"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#F3EAD9"/>

  <!-- Wand: grüne Gouachefläche mit weichem linkem Rand -->
  <g filter="url(#pinsel)">
    <path d="M430 -20 C395 90 450 170 410 260 C380 340 440 420 400 520 C390 600 420 700 396 820 L1220 820 L1220 -20 Z" fill="#2F5D46"/>
    <path d="M398 740 C600 730 900 736 1220 730 L1220 820 L396 820 C400 790 398 760 398 740 Z" fill="#1F4231"/>
    <path d="M520 -10 C560 80 500 160 560 240 C600 300 560 380 600 450 C700 420 800 300 840 160 C860 80 820 20 800 -10 Z" fill="#3D6E55" opacity=".55"/>
    <path d="M900 40 C980 20 1100 60 1180 30 C1160 110 1080 140 980 130 C930 120 880 90 900 40 Z" fill="#4A7A5F" opacity=".5"/>
  </g>
  <!-- Lampenlicht als heller Klecks -->
  <g filter="url(#weich)">
    <ellipse cx="760" cy="300" rx="210" ry="160" fill="#F0D9A6" opacity=".3"/>
  </g>

  <!-- Pflanze hinten rechts -->
  <g filter="url(#pinselfein)">
