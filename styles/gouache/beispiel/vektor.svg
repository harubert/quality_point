  </g>

  <!-- helle Lichtkleckse -->
  <g filter="url(#pinselfein)" fill="#FFF3D6" opacity=".35">
    <path d="M560 470 C620 462 680 464 720 472 C680 482 610 484 560 470 Z"/>
    <path d="M1050 500 C1070 494 1090 496 1104 506 C1086 508 1066 510 1050 500 Z"/>
    <path d="M920 160 C950 150 980 156 990 172 C960 176 936 174 920 160 Z"/>
  </g>

  <!-- Farbstruktur über allem -->
  <rect width="1200" height="800" filter="url(#struktur)" opacity=".12"/>
</svg>
