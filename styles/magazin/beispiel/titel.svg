<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Editorial-Stillleben: lesendes Kind am Tisch, Pflanze, Tasse und Tablet in Terrakotta und Salbei</title>
  <rect width="1200" height="800" fill="#F5F0E8"/>
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#2B2A28" stroke-width="1" opacity=".4"/>
  <!-- Fensterrund als Lichtfläche -->
  <circle cx="880" cy="320" r="250" fill="#EBE4D8"/>
  <!-- Kind hinter dem Tisch, ohne Gesicht -->
  <rect x="760" y="392" width="200" height="200" rx="80" fill="#B04E33"/>
  <rect x="712" y="440" width="58" height="140" rx="29" fill="#B04E33" transform="rotate(26 741 510)"/>
  <rect x="950" y="440" width="58" height="140" rx="29" fill="#B04E33" transform="rotate(-26 979 510)"/>
  <circle cx="860" cy="340" r="62" fill="#2B2A28"/>
  <path d="M798 338 Q860 300 922 338 Q922 290 860 272 Q798 290 798 338 Z" fill="#2B2A28"/>
  <!-- Tisch -->
  <rect x="500" y="560" width="640" height="18" fill="#5F7357"/>
  <rect x="540" y="578" width="14" height="182" fill="#5F7357" opacity=".85"/>
  <rect x="1086" y="578" width="14" height="182" fill="#5F7357" opacity=".85"/>
  <!-- offenes Buch -->
  <path d="M700 566 L826 548 L826 486 L700 504 Z" fill="#FBF8F2" stroke="#2B2A28" stroke-width="1" opacity=".95"/>
  <path d="M826 548 L952 566 L952 504 L826 486 Z" fill="#FBF8F2" stroke="#2B2A28" stroke-width="1" opacity=".95"/>
  <path d="M826 486 V548" stroke="#B04E33" stroke-width="3"/>
  <g stroke="#2B2A28" stroke-width="1.5" opacity=".35">
    <path d="M720 512 L806 500M720 526 L806 514M720 540 L790 530M846 500 L932 512M846 514 L932 526M846 528 L920 538"/>
  </g>
  <!-- Pflanze -->
  <polygon points="1030,490 1114,490 1104,560 1040,560" fill="#B8893A"/>
  <g fill="#5F7357">
    <ellipse cx="1072" cy="430" rx="22" ry="62"/>
    <ellipse cx="1072" cy="430" rx="22" ry="62" transform="rotate(-38 1072 470)"/>
    <ellipse cx="1072" cy="430" rx="22" ry="62" transform="rotate(38 1072 470)"/>
    <ellipse cx="1072" cy="455" rx="18" ry="46" transform="rotate(-72 1072 490)"/>
    <ellipse cx="1072" cy="455" rx="18" ry="46" transform="rotate(72 1072 490)"/>
  </g>
  <!-- Tasse -->
  <rect x="990" y="522" width="48" height="40" rx="7" fill="#FBF8F2" stroke="#2B2A28" stroke-width="1" opacity=".9"/>
  <path d="M1038 532 q18 0 18 14 q0 12 -18 12" fill="none" stroke="#2B2A28" stroke-width="1.5" opacity=".7"/>
  <!-- Tablet, an den Tisch gelehnt -->
  <g transform="rotate(-9 600 680)">
    <rect x="540" y="596" width="122" height="166" rx="8" fill="#2B2A28"/>
    <rect x="550" y="608" width="102" height="142" rx="4" fill="#EBE4D8"/>
    <rect x="562" y="624" width="60" height="6" fill="#B8766A"/>
    <rect x="562" y="640" width="78" height="6" fill="#B8766A" opacity=".7"/>
    <rect x="562" y="700" width="78" height="38" fill="#5F7357" opacity=".55"/>
  </g>
</svg>
