<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Blaupause: Lupe über Bildschirm mit Balken, Schnittschraffur, Maßlinien und Zahnrad</title>
  <defs>
    <pattern id="fein" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F2F6FB" stroke-width="1" opacity=".09"/>
    </pattern>
    <pattern id="grob" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#F2F6FB" stroke-width="1" opacity=".2"/>
    </pattern>
    <pattern id="schraff" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V12" stroke="#F2F6FB" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#F2F6FB"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#123C7F"/>
  <rect width="1200" height="800" fill="url(#fein)"/>
  <rect width="1200" height="800" fill="url(#grob)"/>
  <g fill="none" stroke="#F2F6FB" stroke-width="2.5" stroke-linejoin="round">
    <!-- Bildschirm mit Standfuß -->
    <rect x="520" y="160" width="520" height="340" rx="8"/>
    <rect x="546" y="186" width="468" height="288"/>
    <path d="M740 500 V560 H820 V500 M660 560 H900"/>
    <!-- Balken -->
    <rect x="590" y="380" width="56" height="70"/>
    <rect x="670" y="320" width="56" height="130"/>
    <rect x="750" y="250" width="56" height="200"/>
    <rect x="830" y="300" width="56" height="150"/>
    <rect x="910" y="350" width="56" height="100"/>
    <!-- Lupe -->
    <circle cx="1000" cy="560" r="110"/>
    <circle cx="1000" cy="560" r="92"/>
    <path d="M1078 638 L1160 720 M1092 624 L1174 706 M1160 720 L1174 706"/>
    <!-- Zahnrad -->
    <circle cx="470" cy="660" r="48"/>
    <circle cx="470" cy="660" r="18"/>
    <path d="M470 596V612M470 708V724M406 660H422M518 660H534M425 615L436 626M504 694L515 705M515 615L504 626M436 694L425 705"/>
  </g>
  <!-- Schraffuren und Kreidegelb -->
  <rect x="750" y="250" width="56" height="200" fill="url(#schraff)"/>
  <rect x="830" y="300" width="56" height="150" fill="#F7DC6F" opacity=".8"/>
  <circle cx="1000" cy="560" r="92" fill="#F7DC6F" opacity=".12"/>
  <rect x="590" y="214" width="180" height="16" fill="none" stroke="#F2F6FB" stroke-width="1.5"/>
  <!-- Achsen und Mittellinien -->
  <g stroke="#F2F6FB" stroke-width="1.2" stroke-dasharray="12 7" opacity=".55">
    <path d="M780 120 V600 M480 330 H1080 M1000 420 V700 M860 560 H1140"/>
  </g>
  <path d="M570 450 H990" stroke="#F2F6FB" stroke-width="1.5" opacity=".8"/>
  <!-- Maßlinien -->
  <g stroke="#F2F6FB" stroke-width="1.5" fill="none">
    <path d="M520 110 V130 M1040 110 V130" opacity=".7"/>
    <path d="M524 120 H1036" marker-start="url(#pf)" marker-end="url(#pf)"/>
    <path d="M460 160 H480 M460 500 H480" opacity=".7"/>
    <path d="M470 164 V496" marker-start="url(#pf)" marker-end="url(#pf)"/>
    <path d="M890 760 V780 M1110 760 V780" opacity=".7"/>
    <path d="M894 770 H1106" marker-start="url(#pf)" marker-end="url(#pf)"/>
  </g>
</svg>
