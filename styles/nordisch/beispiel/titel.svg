<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Nordischer Arbeitsplatz: Kind am Holztisch mit Tablet auf Ständer, Büchern, Stiftbecher und Lampe</title>
  <rect width="1200" height="800" fill="#EFEDE8"/>
  <!-- Boden und Wandkante -->
  <rect x="0" y="640" width="1200" height="160" fill="#E4E1DA"/>
  <path d="M0 640 H1200" stroke="#D6D2C9" stroke-width="1"/>
  <!-- Lampe -->
  <path d="M900 0 V150" stroke="#2A2A28" stroke-width="2"/>
  <path d="M840 230 C840 180 960 180 960 230 Z" fill="#5E7E99"/>
  <rect x="840" y="226" width="120" height="14" rx="7" fill="#3F5A70"/>
  <!-- Stuhl und Kind (ohne Gesicht) -->
  <rect x="1010" y="420" width="110" height="18" rx="9" fill="#D9C9A8"/>
  <rect x="1020" y="436" width="14" height="204" rx="7" fill="#D9C9A8"/>
  <rect x="1096" y="436" width="14" height="204" rx="7" fill="#D9C9A8"/>
  <rect x="1104" y="330" width="26" height="110" rx="13" fill="#D9C9A8"/>
  <circle cx="1000" cy="296" r="46" fill="#C9937A"/>
  <path d="M954 290 C958 250 1042 250 1046 290 C1020 278 980 278 954 290 Z" fill="#2A2A28"/>
  <rect x="946" y="348" width="108" height="150" rx="40" fill="#5E7E99"/>
  <path d="M960 400 C920 420 890 450 870 470" stroke="#5E7E99" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- Tisch -->
  <rect x="470" y="470" width="640" height="22" rx="6" fill="#D9C9A8"/>
  <rect x="500" y="492" width="16" height="148" rx="8" fill="#D9C9A8"/>
  <rect x="1070" y="492" width="16" height="148" rx="8" fill="#D9C9A8"/>
  <!-- Tablet auf Ständer -->
  <path d="M700 470 L740 390 L800 470 Z" fill="#C9A86A"/>
  <g transform="rotate(-8 760 380)">
    <rect x="630" y="280" width="260" height="190" rx="14" fill="#3F5A70"/>
    <rect x="646" y="296" width="228" height="158" rx="6" fill="#F8F7F3"/>
    <path d="M760 430 C700 400 700 330 760 310 C820 330 820 400 760 430 Z" fill="#76845F"/>
    <path d="M760 426 V318" stroke="#F8F7F3" stroke-width="3"/>
  </g>
  <!-- Becher -->
  <rect x="920" y="408" width="70" height="62" rx="10" fill="#A96044"/>
  <path d="M990 424 C1012 424 1012 456 990 456" stroke="#A96044" stroke-width="10" fill="none"/>
  <!-- Stiftbecher -->
  <rect x="560" y="420" width="64" height="50" rx="8" fill="#76845F"/>
  <rect x="568" y="356" width="10" height="70" rx="5" fill="#A96044"/>
  <rect x="586" y="344" width="10" height="82" rx="5" fill="#5E7E99"/>
  <rect x="604" y="362" width="10" height="64" rx="5" fill="#C9A86A"/>
  <!-- Bücher -->
  <rect x="650" y="440" width="190" height="30" rx="6" fill="#A96044"/>
  <rect x="664" y="412" width="160" height="28" rx="6" fill="#C9A86A"/>
  <!-- Teppich -->
  <rect x="560" y="700" width="560" height="40" rx="20" fill="#DEE5EB"/>
</svg>
