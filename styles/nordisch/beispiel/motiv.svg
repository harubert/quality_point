<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Nordisches Regal: Kind greift nach einem Buch, daneben Pflanze, Tablet und Hocker</title>
  <rect width="1200" height="800" fill="#EFEDE8"/>
  <rect x="0" y="660" width="1200" height="140" fill="#E4E1DA"/>
  <path d="M0 660 H1200" stroke="#D6D2C9" stroke-width="1"/>
  <!-- Regal -->
  <rect x="640" y="150" width="520" height="16" rx="6" fill="#D9C9A8"/>
  <rect x="640" y="330" width="520" height="16" rx="6" fill="#D9C9A8"/>
  <rect x="640" y="510" width="520" height="16" rx="6" fill="#D9C9A8"/>
  <rect x="648" y="150" width="12" height="510" rx="6" fill="#D9C9A8"/>
  <rect x="1140" y="150" width="12" height="510" rx="6" fill="#D9C9A8"/>
  <!-- oberes Fach: Bücher und Pflanze -->
  <rect x="680" y="64" width="26" height="86" rx="5" fill="#A96044"/>
  <rect x="712" y="80" width="22" height="70" rx="5" fill="#5E7E99"/>
  <rect x="740" y="56" width="30" height="94" rx="5" fill="#76845F"/>
  <rect x="776" y="90" width="20" height="60" rx="5" fill="#C9A86A"/>
  <rect x="1020" y="104" width="90" height="46" rx="10" fill="#A96044"/>
  <path d="M1065 104 C1060 70 1070 44 1065 20 M1065 80 C1040 74 1024 56 1020 36 M1065 60 C1090 54 1106 36 1110 16" stroke="#76845F" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="1020" cy="36" r="14" fill="#76845F"/>
  <circle cx="1110" cy="16" r="14" fill="#76845F"/>
  <circle cx="1065" cy="20" r="14" fill="#76845F"/>
  <!-- mittleres Fach: Tablet und Becher -->
  <rect x="880" y="224" width="150" height="106" rx="10" fill="#3F5A70"/>
  <rect x="892" y="236" width="126" height="82" rx="4" fill="#F8F7F3"/>
  <path d="M912 306 L940 270 L962 292 L992 252 L1010 306 Z" fill="#5E7E99"/>
  <rect x="1070" y="280" width="54" height="50" rx="8" fill="#C9A86A"/>
  <!-- unteres Fach: liegende Bücher -->
  <rect x="900" y="470" width="220" height="40" rx="8" fill="#5E7E99"/>
  <rect x="920" y="436" width="180" height="34" rx="8" fill="#76845F"/>
  <!-- Hocker -->
  <rect x="440" y="560" width="150" height="20" rx="10" fill="#D9C9A8"/>
  <rect x="456" y="580" width="14" height="80" rx="7" fill="#D9C9A8"/>
  <rect x="560" y="580" width="14" height="80" rx="7" fill="#D9C9A8"/>
  <!-- Kind (ohne Gesicht), nach oben greifend -->
  <circle cx="720" cy="270" r="48" fill="#C9937A"/>
  <path d="M672 266 C676 222 764 222 768 266 C740 252 700 252 672 266 Z" fill="#2A2A28"/>
  <rect x="664" y="326" width="112" height="200" rx="44" fill="#A96044"/>
  <path d="M760 350 C790 300 800 250 790 196" stroke="#A96044" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M676 380 C640 400 620 430 616 470" stroke="#A96044" stroke-width="30" stroke-linecap="round" fill="none"/>
  <rect x="676" y="520" width="38" height="140" rx="19" fill="#3F5A70"/>
  <rect x="728" y="520" width="38" height="140" rx="19" fill="#3F5A70"/>
  <!-- Buch in der Hand -->
  <rect x="778" y="180" width="60" height="42" rx="6" fill="#C9A86A" transform="rotate(-12 808 201)"/>
  <!-- Teppich -->
  <rect x="600" y="700" width="560" height="40" rx="20" fill="#DEE5EB"/>
</svg>
