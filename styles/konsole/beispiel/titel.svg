<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Bernstein-Terminal: Laptop mit Textzeilen, Kind als Silhouette von hinten, Bücherstapel</title>
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#141311"/>
  <ellipse cx="800" cy="360" rx="330" ry="200" fill="#FFB000" opacity=".16" filter="url(#glow)"/>
  <!-- Bücherstapel links neben dem Laptop -->
  <g fill="none" stroke="#FFB000" stroke-width="3">
    <rect x="430" y="596" width="220" height="42"/>
    <rect x="446" y="554" width="200" height="42"/>
    <rect x="436" y="512" width="214" height="42"/>
  </g>
  <rect x="446" y="554" width="200" height="42" fill="#FFB000" opacity=".35"/>
  <g stroke="#FFB000" stroke-width="2" opacity=".6"><path d="M460 617H600M470 533H610"/></g>
  <!-- Laptop -->
  <rect x="560" y="150" width="540" height="350" rx="8" fill="#0C0B0A" stroke="#FFB000" stroke-width="4"/>
  <rect x="586" y="176" width="488" height="298" fill="#0C0B0A" stroke="#FFB000" stroke-width="1.5" opacity=".6"/>
  <g fill="#FFB000">
    <rect x="612" y="206" width="24" height="12" opacity=".95"/>
    <rect x="648" y="206" width="220" height="12" opacity=".85"/>
    <rect x="612" y="234" width="300" height="12" opacity=".55"/>
    <rect x="612" y="262" width="180" height="12" opacity=".55"/>
    <rect x="612" y="290" width="24" height="12" opacity=".95"/>
    <rect x="648" y="290" width="150" height="12" opacity=".85"/>
    <rect x="612" y="318" width="360" height="12" opacity=".55"/>
    <rect x="612" y="346" width="240" height="12" opacity=".55"/>
    <rect x="612" y="374" width="24" height="12" opacity=".95"/>
    <rect x="648" y="374" width="120" height="12" opacity=".85"/>
    <rect x="648" y="402" width="90" height="12" opacity=".55"/>
    <rect x="612" y="430" width="24" height="14"/>
  </g>
  <rect x="880" y="262" width="150" height="100" fill="#6FC3B2" opacity=".35" stroke="#6FC3B2" stroke-width="2"/>
  <g fill="#6FC3B2" opacity=".9"><rect x="896" y="330" width="18" height="20"/><rect x="924" y="300" width="18" height="50"/><rect x="952" y="282" width="18" height="68"/><rect x="980" y="312" width="18" height="38"/></g>
  <polygon points="500,560 1160,560 1100,500 560,500" fill="#0C0B0A" stroke="#FFB000" stroke-width="4"/>
  <rect x="700" y="518" width="260" height="14" fill="#FFB000" opacity=".4"/>
  <!-- Kind von hinten -->
  <path d="M880 800 Q880 640 1000 616 Q1120 640 1120 800 Z" fill="#1E1D1A" stroke="#FFB000" stroke-width="2" opacity=".95"/>
  <circle cx="1000" cy="560" r="66" fill="#1E1D1A" stroke="#FFB000" stroke-width="2"/>
  <!-- Scanlines -->
  <rect width="1200" height="800" fill="url(#scan)"/>
</svg>
