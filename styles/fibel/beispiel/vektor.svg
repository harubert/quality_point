<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Fibel-Schreibtisch aus Grundformen: Tablet, Bücher, Stifte und Bauklötze in Rot, Blau und Gelb</title>
  <defs>
    <!-- harter Versatzschatten: schwarze Kopie 10 px nach rechts unten -->
    <filter id="sch" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dx="10" dy="10" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#F3EAD5"/>

  <g stroke="#141414" stroke-width="6" stroke-linejoin="miter">
    <!-- Hintergrund: Sonne und Fensterquadrat -->
    <g filter="url(#sch)">
      <rect x="1010" y="70" width="150" height="150" fill="#2347A8"/>
      <circle cx="1085" cy="145" r="44" fill="#F2C230"/>
    </g>
    <g filter="url(#sch)">
      <circle cx="730" cy="190" r="100" fill="#C42B22"/>
    </g>

    <!-- Wandregal mit Buchrücken -->
    <g filter="url(#sch)">
      <rect x="860" y="285" width="300" height="22" fill="#141414"/>
    </g>
    <g filter="url(#sch)">
      <rect x="880" y="185" width="34" height="100" fill="#F2C230"/>
      <rect x="914" y="205" width="34" height="80" fill="#2347A8"/>
      <rect x="948" y="175" width="34" height="110" fill="#C42B22"/>
      <polygon points="990,285 1026,190 1056,200 1022,285" fill="#F3EAD5"/>
    </g>

    <!-- Tischbeine -->
    <g filter="url(#sch)">
      <rect x="470" y="640" width="30" height="170" fill="#141414"/>
      <rect x="1120" y="640" width="30" height="170" fill="#141414"/>
    </g>
    <!-- Tischplatte -->
    <g filter="url(#sch)">
      <rect x="430" y="600" width="760" height="44" fill="#F2C230"/>
    </g>

    <!-- Stiftebecher -->
    <g filter="url(#sch)">
      <rect x="464" y="440" width="22" height="90" fill="#C42B22"/>
      <polygon points="464,440 486,440 475,412" fill="#F3EAD5"/>
      <rect x="494" y="420" width="22" height="110" fill="#F2C230"/>
      <polygon points="494,420 516,420 505,392" fill="#F3EAD5"/>
      <rect x="524" y="452" width="22" height="80" fill="#2347A8"/>
      <polygon points="524,452 546,452 535,424" fill="#F3EAD5"/>
    </g>
    <g filter="url(#sch)">
      <rect x="452" y="500" width="108" height="100" fill="#2347A8"/>
      <circle cx="506" cy="550" r="22" fill="#F2C230"/>
    </g>

    <!-- Tablet auf Ständer -->
    <g filter="url(#sch)">
      <rect x="716" y="530" width="60" height="70" fill="#141414"/>
    </g>
    <g filter="url(#sch)">
      <rect x="596" y="330" width="300" height="210" fill="#141414"/>
      <rect x="618" y="350" width="256" height="170" fill="#F3EAD5"/>
      <rect x="618" y="470" width="256" height="50" fill="#2347A8"/>
      <circle cx="830" cy="396" r="26" fill="#F2C230"/>
      <polygon points="650,470 705,380 760,470" fill="#C42B22"/>
      <rect x="760" y="420" width="50" height="50" fill="#F2C230"/>
      <polygon points="752,420 785,388 818,420" fill="#C42B22"/>
    </g>

    <!-- Bücherstapel -->
    <g filter="url(#sch)">
      <rect x="930" y="556" width="200" height="44" fill="#C42B22"/>
      <rect x="946" y="512" width="176" height="44" fill="#2347A8"/>
      <rect x="922" y="468" width="190" height="44" fill="#F2C230"/>
    </g>
    <!-- Haus aus Klötzen auf dem Stapel -->
    <g filter="url(#sch)">
      <rect x="980" y="388" width="80" height="80" fill="#2347A8"/>
      <rect x="1006" y="424" width="28" height="44" fill="#141414"/>
      <polygon points="966,388 1020,330 1074,388" fill="#C42B22"/>
    </g>

    <!-- Klötze auf der Tischplatte -->
    <g filter="url(#sch)">
      <circle cx="864" cy="572" r="26" fill="#F2C230"/>
    </g>
    <g filter="url(#sch)">
      <polygon points="1140,600 1162,548 1184,600" fill="#2347A8"/>
    </g>

    <!-- Lineal und Stift liegend -->
    <g filter="url(#sch)">
      <rect x="610" y="574" width="170" height="20" fill="#C42B22"/>
      <polygon points="780,574 810,584 780,594" fill="#F3EAD5"/>
    </g>
    <!-- Stuhllehne vor dem Tisch -->
    <g filter="url(#sch)">
      <rect x="640" y="720" width="26" height="90" fill="#141414"/>
      <rect x="884" y="720" width="26" height="90" fill="#141414"/>
      <rect x="610" y="680" width="330" height="70" fill="#C42B22"/>
    </g>
  </g>

  <!-- Boden -->
  <rect x="400" y="790" width="800" height="10" fill="#141414"/>
</svg>
