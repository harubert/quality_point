<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Schweizer Raster: Bildschirm mit Balken, rote Lupe, Signalquadrate</title>
  <rect width="1200" height="800" fill="#F7F7F4"/>
  <g stroke="#111" stroke-width="1" opacity=".11">
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800M800 0V800M900 0V800M1000 0V800M1100 0V800"/>
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/>
  </g>
  <!-- Bildschirm mit Balkendiagramm -->
  <rect x="500" y="160" width="500" height="340" fill="#111"/>
  <rect x="524" y="184" width="452" height="292" fill="#F7F7F4"/>
  <rect x="560" y="380" width="60" height="70" fill="#111"/>
  <rect x="640" y="320" width="60" height="130" fill="#111"/>
  <rect x="720" y="250" width="60" height="200" fill="#E30613"/>
  <rect x="800" y="290" width="60" height="160" fill="#111"/>
  <rect x="880" y="340" width="60" height="110" fill="#111"/>
  <rect x="560" y="210" width="200" height="14" fill="#111"/>
  <!-- rote Lupe -->
  <circle cx="960" cy="560" r="120" fill="none" stroke="#E30613" stroke-width="30"/>
  <rect x="1040" y="645" width="170" height="40" fill="#111" transform="rotate(45 1040 645)"/>
  <!-- Standfuß und Signalquadrate -->
  <rect x="700" y="500" width="100" height="60" fill="#111"/>
  <rect x="600" y="560" width="300" height="16" fill="#111"/>
  <rect x="420" y="690" width="70" height="70" fill="#111"/>
  <rect x="520" y="690" width="70" height="70" fill="#E30613"/>
  <rect x="620" y="690" width="70" height="70" fill="#111"/>
  <rect x="720" y="690" width="70" height="70" fill="#111"/>
</svg>
