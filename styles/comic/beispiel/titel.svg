<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Comic-Panel: leuchtendes Tablet mit Bücherstapel und Stiften</title>
  <defs>
    <pattern id="raster" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="4.2" fill="#D7191C" opacity=".35"/></pattern>
    <pattern id="rasterB" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3" fill="#1565C0" opacity=".45"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="#FFF6DC"/>
  <rect x="380" width="820" height="800" fill="url(#raster)"/>
  <!-- Speedlines -->
  <g stroke="#111" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M780 120 L740 40 M880 110 L900 20 M980 140 L1060 60 M1030 230 L1140 200 M640 170 L560 110 M1050 340 L1160 360"/>
  </g>
  <!-- Explosion hinter dem Tablet -->
  <polygon points="820,90 870,190 980,150 940,250 1070,280 960,330 1030,430 900,400 870,520 800,420 700,480 720,370 600,330 710,290 650,190 760,220" fill="#FFD400" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
  <!-- Tablet -->
  <g transform="rotate(-7 830 400)">
    <rect x="640" y="270" width="380" height="270" rx="24" fill="#111"/>
    <rect x="664" y="294" width="332" height="222" rx="8" fill="#D6E6FA"/>
    <rect x="664" y="294" width="332" height="222" rx="8" fill="url(#rasterB)"/>
    <circle cx="830" cy="405" r="62" fill="#D7191C" stroke="#111" stroke-width="6"/>
    <path d="M812 375 L812 435 L860 405 Z" fill="#FFF" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Bücher -->
  <g stroke="#111" stroke-width="6" stroke-linejoin="round">
    <rect x="450" y="560" width="270" height="56" rx="6" fill="#1565C0"/>
    <rect x="475" y="616" width="240" height="56" rx="6" fill="#FFD400"/>
    <rect x="440" y="672" width="290" height="56" rx="6" fill="#D7191C"/>
  </g>
  <!-- Stifte -->
  <g stroke="#111" stroke-width="5" stroke-linejoin="round">
    <polygon points="800,650 1010,610 1018,640 808,680" fill="#FF7A00"/>
    <polygon points="1010,610 1060,615 1018,640" fill="#FFF6DC"/>
    <polygon points="820,700 1030,680 1032,708 822,728" fill="#1565C0"/>
    <polygon points="1030,680 1078,694 1032,708" fill="#FFF6DC"/>
  </g>
  <!-- Ausrufezeichen-Blase -->
  <g stroke="#111" stroke-width="6" stroke-linejoin="round">
    <path d="M1060 470 a70 60 0 1 1 30 108 l-10 40 -30 -46 a70 60 0 0 1 10 -102 Z" fill="#FFF"/>
  </g>
  <rect x="1078" y="488" width="18" height="52" rx="6" fill="#D7191C" stroke="#111" stroke-width="4"/>
  <circle cx="1087" cy="562" r="10" fill="#D7191C" stroke="#111" stroke-width="4"/>
  <!-- Panelrahmen -->
  <rect x="380" y="16" width="804" height="768" fill="none" stroke="#111" stroke-width="10"/>
</svg>
